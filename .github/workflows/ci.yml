name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l1-gate-proof:
    name: "L1: Pre-commit proof"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@2231caf82cf16f103f48cab467b3464b106d6604
        with:
          package-manager: bun
          runtime-version: "1.4.3"
          node-version: "26.12.1"
          install-policy: blocked

      - name: Run L1 gate self-test
        run: bun run verify:l1-gate

  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae
    with:
      runtime-version: "1.4.3"
      node-version: "26.12.1"
      install-policy: blocked
      typecheck-command: bun run typecheck
      lint-command: bun run lint
      test-command: bun run test:coverage
      coverage-path: coverage
      build: true
      build-command: bun run build
      lockfiles: bun.lock
  workflows:
    uses: nocoo/base-ci/.github/workflows/workflow-lint.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae
    with:
      required-reusable-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      yamllint: true
