# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, B1, L1, Z1 via quality.yml;
# na L1.5, L2, P1; todo L3 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs, workflow-lint inline.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l1-gate-proof:
    name: "L1: Pre-commit proof"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
        with:
          package-manager: bun
          runtime-version: "1.4.3"
          node-version: "26.12.1"
          install-policy: blocked

      - name: Run L1 gate self-test
        run: bun run verify:l1-gate

  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.4.3"
      node-version: "26.12.1"
      install-policy: blocked
      typecheck-command: bun run typecheck
      lint-command: bun run lint
      test-command: bun run test:coverage
      coverage-path: coverage
      lockfiles: bun.lock
      build: true
      build-command: bun run build
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      workflow-lint-yamllint: true
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "Worker 仅以静态资源部署，无 @cloudflare/vitest-pool-workers / miniflare 运行时测试套件"},
        "L2": {"status": "na", "reason": "无 CI 内外部 HTTP API E2E；仅有 Worker 静态 dist 与发布后的 verify:production 冒烟"},
        "L3": {"status": "todo", "reason": "Playwright 配置已就绪但 tests/e2e 尚未建立，当前 CI 未运行浏览器 E2E"},
        "P1": {"status": "na", "reason": "package.json 为 private，不发布 npm 包"},
        "Z1": {"status": "impl"}}
