name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae
    with:
      runtime-version: '1.4.3'
      node-version: '26.12.1'
      install-policy: blocked
      typecheck-command: bun run typecheck
      lint-command: bun run lint
      test-command: bun run test:coverage
      coverage-path: coverage
      build: true
      build-command: bun run build
      lockfiles: bun.lock
  workflows:
    uses: nocoo/base-ci/.github/workflows/workflow-lint.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae
    with:
      required-reusable-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      yamllint: true
